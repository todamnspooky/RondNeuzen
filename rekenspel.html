<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekenspel | Rondneuzen</title>
  <link rel="icon" href="Data/Favicon/favicon.ico" sizes="any">
  <link rel="icon" href="Data/Favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="Data/Favicon/apple-touch-icon.png">
  <link rel="manifest" href="Data/Favicon/site.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img class="site-logo" src="Data/Logo/RondNeuzen.jpg" alt="Rondneuzen logo">
  <a href="spelletjes.html" class="games-link" aria-label="Naar spelletjes"><img src="Data/Logo/Controller.webp" alt=""></a>
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="menu-button" aria-label="Open menu">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <nav class="menu" aria-label="Hoofdnavigatie">
    <a href="index.html">Home</a>
    <a href="over-mij.html">Over mij</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="math-game">
    <section class="memory-setup math-setup" id="mode-selection">
      <p class="eyebrow">Oefenen of testen</p>
      <h1>Rekenspel</h1>

      <div class="setup-group">
        <p class="setup-label">Kies hoe je antwoordt</p>
        <div class="lives-options" id="choice-mode-options" aria-label="Kies hoe je antwoordt">
          <button type="button" class="selected" data-choice-mode="3" aria-pressed="true">
            <span class="option-icon" aria-hidden="true">3️⃣</span>
            <span class="option-title">3 keuzes</span>
          </button>
          <button type="button" data-choice-mode="6" aria-pressed="false">
            <span class="option-icon" aria-hidden="true">6️⃣</span>
            <span class="option-title">6 keuzes</span>
          </button>
          <button type="button" data-choice-mode="9" aria-pressed="false">
            <span class="option-icon" aria-hidden="true">9️⃣</span>
            <span class="option-title">9 keuzes</span>
          </button>
          <button type="button" data-choice-mode="input" aria-pressed="false">
            <span class="option-icon" aria-hidden="true">⌨️</span>
            <span class="option-title">Zelf invullen</span>
          </button>
        </div>
      </div>

      <div class="setup-group">
        <p class="setup-label">Kies een onderdeel</p>
        <div class="grid-options" aria-label="Kies een onderdeel">
          <button type="button" data-mode="plus">Plus (+)</button>
          <button type="button" data-mode="minus">Min (−)</button>
          <button type="button" data-mode="times">Keer (×)</button>
          <button type="button" data-mode="all">Alles door elkaar</button>
        </div>
      </div>
      <a href="spelletjes.html" class="back-link">Terug</a>
    </section>

    <section class="table-selection" id="table-selection" hidden>
      <p class="eyebrow" id="level-eyebrow">Kies een tafel</p>
      <h1>Rekenspel</h1>
      <div class="table-options" id="table-options" aria-label="Kies welk niveau je wilt oefenen"></div>
      <button type="button" class="back-link" id="back-to-modes">Terug</button>
    </section>

    <section class="game-session" id="game-session" hidden>
      <p class="eyebrow" id="selected-table-label">Tafels 1 t/m 10</p>

      <section class="math-question" id="math-question">
        <h2 id="question-text"></h2>
        <div class="answer-options choices-3" id="answer-options"></div>

        <div class="math-input-container" id="math-input-container" hidden>
          <div class="math-input-row">
            <div class="math-input-box" id="math-input-box" aria-live="polite">
              <span class="math-input-value" id="math-input-value"></span>
              <span class="math-cursor" aria-hidden="true">|</span>
            </div>
            <button type="button" class="check-button" id="math-check-btn" aria-label="Controleer antwoord" disabled>➔</button>
          </div>

          <div class="math-keypad" id="math-keypad" aria-label="Cijfertoetsen">
            <button type="button" class="math-key" data-key="1">1</button>
            <button type="button" class="math-key" data-key="2">2</button>
            <button type="button" class="math-key" data-key="3">3</button>
            <button type="button" class="math-key" data-key="4">4</button>
            <button type="button" class="math-key" data-key="5">5</button>
            <button type="button" class="math-key" data-key="6">6</button>
            <button type="button" class="math-key" data-key="7">7</button>
            <button type="button" class="math-key" data-key="8">8</button>
            <button type="button" class="math-key" data-key="9">9</button>
            <button type="button" class="math-key math-key-action" data-key="clear" aria-label="Wis alles">C</button>
            <button type="button" class="math-key" data-key="0">0</button>
            <button type="button" class="math-key math-key-action" data-key="backspace" aria-label="Wis cijfer">⌫</button>
          </div>
        </div>
      </section>

      <ol class="answer-progress" id="answer-progress" aria-label="Voortgang van de antwoorden">
        <li aria-label="Ronde 1">○</li>
        <li aria-label="Ronde 2">○</li>
        <li aria-label="Ronde 3">○</li>
        <li aria-label="Ronde 4">○</li>
        <li aria-label="Ronde 5">○</li>
        <li aria-label="Ronde 6">○</li>
        <li aria-label="Ronde 7">○</li>
        <li aria-label="Ronde 8">○</li>
        <li aria-label="Ronde 9">○</li>
        <li aria-label="Ronde 10">○</li>
      </ol>

      <p class="game-feedback" id="game-feedback" aria-live="polite"></p>
      <section class="game-result" id="game-result" hidden>
        <div class="trophy" id="trophy" aria-hidden="true" hidden>🏆</div>
        <h2 id="result-title">Goed gedaan!</h2>
        <p id="score"></p>
        <div class="game-actions">
          <button type="button" id="restart-game">Nog een keer!</button>
          <button type="button" id="choose-table">Opnieuw kiezen!</button>
        </div>
      </section>
    </section>
  </main>

  <script src="Data/Games-Data/Rekenspel/Sommen-Data.js"></script>
  <script>
    if (
      typeof timesBank === 'undefined' || timesBank.length !== 100 ||
      typeof plusBank === 'undefined' || plusBank.length !== 2500 ||
      typeof minusBank === 'undefined' || minusBank.length !== 4950
    ) {
      throw new Error('Ongeldige sommenbank: controleer Data/Games-Data/Rekenspel/Sommen-Data.js.');
    }

    const MODES_CONFIG = {
      3: {
        totalChoices: 3,
        neededFakes: 2,
        marginFactor: 0.20,
        minPoolSize: 5
      },
      6: {
        totalChoices: 6,
        neededFakes: 5,
        marginFactor: 0.35,
        minPoolSize: 9
      },
      9: {
        totalChoices: 9,
        neededFakes: 8,
        marginFactor: 0.50,
        minPoolSize: 14
      },
      input: {
        type: 'input'
      }
    };

    const toSumObjects = (bank) => bank.map((text) => ({
      text,
      answer: text.split(' = ')[1]
    }));

    const timesSums = toSumObjects(timesBank);
    const plusSums = toSumObjects(plusBank);
    const minusSums = toSumObjects(minusBank);

    const questionText = document.querySelector('#question-text');
    const answerOptions = document.querySelector('#answer-options');
    const answerProgress = [...document.querySelectorAll('#answer-progress li')];
    const feedback = document.querySelector('#game-feedback');
    const result = document.querySelector('#game-result');
    const trophy = document.querySelector('#trophy');
    const resultTitle = document.querySelector('#result-title');
    const scoreText = document.querySelector('#score');
    const restartButton = document.querySelector('#restart-game');
    const chooseTableButton = document.querySelector('#choose-table');
    const modeSelection = document.querySelector('#mode-selection');
    const tableSelection = document.querySelector('#table-selection');
    const levelEyebrow = document.querySelector('#level-eyebrow');
    const tableOptions = document.querySelector('#table-options');
    const backToModesButton = document.querySelector('#back-to-modes');
    const gameSession = document.querySelector('#game-session');
    const selectedTableLabel = document.querySelector('#selected-table-label');
    const mathQuestion = document.querySelector('#math-question');
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    const choiceModeButtons = [...document.querySelectorAll('[data-choice-mode]')];

    const mathInputContainer = document.querySelector('#math-input-container');
    const mathInputBox = document.querySelector('#math-input-box');
    const mathInputValue = document.querySelector('#math-input-value');
    const mathCheckBtn = document.querySelector('#math-check-btn');
    const mathKeypad = document.querySelector('#math-keypad');

    let currentRound = 0;
    let score = 0;
    let currentSum;
    let selectedSums = [];
    let gameSums = [];
    let selectedMode = 'times';
    let selectedLevel = 'all';
    let selectedChoiceMode = '3';
    let currentInput = '';
    let isTransitioning = false;
    let roundTimeoutId = null;

    function shuffle(items) {
      const shuffled = [...items];

      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
      }

      return shuffled;
    }

    function generateChoices(target, config) {
      const margin = Math.max(Math.ceil(target * config.marginFactor), 1);
      let min = Math.max(0, target - margin);
      let max = target + margin;

      if ((max - min) < config.minPoolSize) {
        min = 0;
        max = Math.max(max, min + config.minPoolSize);
      }

      const pool = [];
      for (let num = min; num <= max; num += 1) {
        if (num !== target) {
          pool.push(num);
        }
      }

      const shuffledPool = shuffle(pool);
      const fakeAnswers = shuffledPool.slice(0, config.neededFakes);
      return shuffle([target, ...fakeAnswers]);
    }

    function getSessionLabel(mode, level) {
      if (mode === 'times') {
        return level === 'all' ? 'Alle tafels' : `Tafel van ${level}`;
      }
      if (mode === 'plus') {
        return level === 'all' ? 'Alle plussommen' : `Plus tot ${level}`;
      }
      if (mode === 'minus') {
        return level === 'all' ? 'Alle minsommen' : `Min tot ${level}`;
      }
      return level === 'all' ? 'Alles door elkaar' : `Alles door elkaar tot ${level}`;
    }

    function openLevelSelection(mode) {
      selectedMode = mode;
      tableOptions.replaceChildren();

      const buttonsConfig = [];

      if (mode === 'times') {
        levelEyebrow.textContent = 'Kies een tafel';
        buttonsConfig.push({ level: 'all', label: 'Alle tafels oefenen' });
        for (let table = 1; table <= 10; table += 1) {
          buttonsConfig.push({ level: String(table), label: `Tafel van ${table}` });
        }
      } else {
        if (mode === 'plus') {
          levelEyebrow.textContent = 'Plus • Kies een niveau';
          buttonsConfig.push({ level: 'all', label: 'Alle plussommen oefenen' });
        } else if (mode === 'minus') {
          levelEyebrow.textContent = 'Min • Kies een niveau';
          buttonsConfig.push({ level: 'all', label: 'Alle minsommen oefenen' });
        } else {
          levelEyebrow.textContent = 'Alles door elkaar • Kies een niveau';
          buttonsConfig.push({ level: 'all', label: 'Alle sommen oefenen' });
        }

        for (let limit = 10; limit <= 90; limit += 10) {
          buttonsConfig.push({ level: String(limit), label: `Tot ${limit}` });
        }
      }

      buttonsConfig.forEach((item) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.level = item.level;
        button.textContent = item.label;
        button.addEventListener('click', () => startGame(item.level));
        tableOptions.append(button);
      });

      modeSelection.hidden = true;
      gameSession.hidden = true;
      tableSelection.hidden = false;
    }

    function showQuestion() {
      isTransitioning = false;
      currentSum = gameSums[currentRound];
      const target = Number(currentSum.answer);

      let question = currentSum.text.replace(/ = \d+$/, ' = ?');
      if (currentSum.text.includes(' + ')) {
        const [a, b] = currentSum.text.split(' = ')[0].split(' + ');
        const [first, second] = shuffle([a, b]);
        question = `${first} + ${second} = ?`;
      }

      questionText.textContent = question;
      feedback.className = 'game-feedback';
      feedback.textContent = '';

      if (selectedChoiceMode === 'input') {
        if (answerOptions) {
          answerOptions.hidden = true;
          answerOptions.replaceChildren();
        }
        if (mathInputContainer) {
          mathInputContainer.hidden = false;
        }
        currentInput = '';
        if (mathInputValue) mathInputValue.textContent = '';
        if (mathInputBox) mathInputBox.className = 'math-input-box';
        if (mathCheckBtn) mathCheckBtn.disabled = true;
        if (mathKeypad) {
          mathKeypad.querySelectorAll('button').forEach((btn) => {
            btn.disabled = false;
          });
        }
      } else {
        if (mathInputContainer) mathInputContainer.hidden = true;
        if (answerOptions) {
          answerOptions.hidden = false;
          answerOptions.className = `answer-options choices-${selectedChoiceMode}`;
          answerOptions.replaceChildren();

          const cfg = MODES_CONFIG[selectedChoiceMode] || MODES_CONFIG['3'];
          const choices = generateChoices(target, cfg);

          choices.forEach((answer) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.answer = String(answer);
            button.textContent = String(answer);
            button.addEventListener('click', () => checkAnswer(String(answer), button));
            answerOptions.append(button);
          });
        }
      }
    }

    function startGame(level) {
      clearTimeout(roundTimeoutId);
      isTransitioning = false;
      selectedLevel = level;

      if (selectedMode === 'times') {
        selectedSums = selectedLevel === 'all'
          ? timesSums
          : timesSums.filter((sum) => Number(sum.text.split(' × ')[0]) === Number(selectedLevel));
        gameSums = shuffle(selectedSums).slice(0, 10);
      } else if (selectedMode === 'plus') {
        selectedSums = selectedLevel === 'all'
          ? plusSums
          : plusSums.filter((sum) => Number(sum.answer) <= Number(selectedLevel));
        gameSums = shuffle(selectedSums).slice(0, 10);
      } else if (selectedMode === 'minus') {
        selectedSums = selectedLevel === 'all'
          ? minusSums
          : minusSums.filter((sum) => Number(sum.text.split(' − ')[0]) <= Number(selectedLevel));
        gameSums = shuffle(selectedSums).slice(0, 10);
      } else {
        const matchingTimes = selectedLevel === 'all'
          ? timesSums
          : timesSums.filter((sum) => Number(sum.answer) <= Number(selectedLevel));
        const matchingPlus = selectedLevel === 'all'
          ? plusSums
          : plusSums.filter((sum) => Number(sum.answer) <= Number(selectedLevel));
        const matchingMinus = selectedLevel === 'all'
          ? minusSums
          : minusSums.filter((sum) => Number(sum.text.split(' − ')[0]) <= Number(selectedLevel));

        selectedSums = [...matchingTimes, ...matchingPlus, ...matchingMinus];
        gameSums = shuffle([
          ...shuffle(matchingTimes).slice(0, 10),
          ...shuffle(matchingPlus).slice(0, 10),
          ...shuffle(matchingMinus).slice(0, 10)
        ]).slice(0, 10);
      }

      currentRound = 0;
      score = 0;
      selectedTableLabel.textContent = getSessionLabel(selectedMode, selectedLevel);
      answerProgress.forEach((progressItem, index) => {
        progressItem.textContent = '○';
        progressItem.className = '';
        progressItem.setAttribute('aria-label', `Ronde ${index + 1}`);
      });
      modeSelection.hidden = true;
      tableSelection.hidden = true;
      gameSession.hidden = false;
      mathQuestion.hidden = false;
      feedback.className = 'game-feedback';
      feedback.hidden = false;
      result.hidden = true;
      trophy.hidden = true;
      resultTitle.textContent = 'Goed gedaan!';
      showQuestion();
    }

    function checkAnswer(submittedAnswer, chosenButton) {
      if (isTransitioning) return;
      isTransitioning = true;

      const isCorrect = Number(submittedAnswer) === Number(currentSum.answer);
      const progressItem = answerProgress[currentRound];

      if (selectedChoiceMode === 'input') {
        if (mathCheckBtn) mathCheckBtn.disabled = true;
        if (mathKeypad) {
          mathKeypad.querySelectorAll('button').forEach((b) => { b.disabled = true; });
        }
        if (mathInputBox) {
          mathInputBox.classList.add(isCorrect ? 'correct' : 'incorrect');
        }
      } else if (answerOptions) {
        answerOptions.querySelectorAll('button').forEach((button) => {
          button.disabled = true;
          if (String(button.dataset.answer) === String(currentSum.answer)) {
            button.classList.add('correct');
          } else if (button === chosenButton && !isCorrect) {
            button.classList.add('incorrect');
          }
        });
      }

      if (progressItem) {
        progressItem.textContent = isCorrect ? '😊' : '😢';
        progressItem.className = isCorrect ? 'correct' : 'incorrect';
        progressItem.setAttribute('aria-label', isCorrect ? `Ronde ${currentRound + 1}: goed` : `Ronde ${currentRound + 1}: fout`);
      }

      feedback.textContent = isCorrect ? 'Goed gedaan!' : `Bijna! Het goede antwoord is ${currentSum.answer}.`;
      feedback.className = `game-feedback ${isCorrect ? 'correct' : 'incorrect'}`;
      score += isCorrect ? 1 : 0;

      const delay = isCorrect ? 1500 : 2800;
      roundTimeoutId = setTimeout(() => {
        currentRound += 1;
        if (currentRound < 10) {
          showQuestion();
        } else {
          mathQuestion.hidden = true;
          feedback.hidden = true;
          if (mathInputContainer) mathInputContainer.hidden = true;
          const perfectScore = score === 10;
          trophy.hidden = !perfectScore;
          resultTitle.textContent = perfectScore ? 'Gefeliciteerd!' : 'Goed gedaan!';
          scoreText.textContent = `Je hebt ${score} van de 10 sommen goed.`;
          result.hidden = false;
        }
        isTransitioning = false;
      }, delay);
    }

    function handleKeypadInput(digit) {
      if (isTransitioning || selectedChoiceMode !== 'input') return;
      if (currentInput.length < 5) {
        currentInput = currentInput === '0' ? digit : currentInput + digit;
        if (mathInputValue) mathInputValue.textContent = currentInput;
        if (mathCheckBtn) mathCheckBtn.disabled = currentInput.length === 0;
      }
    }

    function handleKeypadBackspace() {
      if (isTransitioning || selectedChoiceMode !== 'input') return;
      currentInput = currentInput.slice(0, -1);
      if (mathInputValue) mathInputValue.textContent = currentInput;
      if (mathCheckBtn) mathCheckBtn.disabled = currentInput.length === 0;
    }

    function handleKeypadClear() {
      if (isTransitioning || selectedChoiceMode !== 'input') return;
      currentInput = '';
      if (mathInputValue) mathInputValue.textContent = '';
      if (mathCheckBtn) mathCheckBtn.disabled = true;
    }

    if (mathKeypad) {
      mathKeypad.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          const key = button.dataset.key;
          if (key === 'backspace') {
            handleKeypadBackspace();
          } else if (key === 'clear') {
            handleKeypadClear();
          } else if (key) {
            handleKeypadInput(key);
          }
        });
      });
    }

    if (mathInputBox) {
      mathInputBox.addEventListener('click', () => {
        handleKeypadBackspace();
      });
    }

    if (mathCheckBtn) {
      mathCheckBtn.addEventListener('click', () => {
        if (!mathCheckBtn.disabled && currentInput.length > 0) {
          checkAnswer(currentInput);
        }
      });
    }

    if (typeof window !== 'undefined') {
      window.addEventListener('keydown', (event) => {
        if (gameSession.hidden || selectedChoiceMode !== 'input' || isTransitioning) return;
        if (event.key >= '0' && event.key <= '9') {
          event.preventDefault();
          handleKeypadInput(event.key);
        } else if (event.key === 'Backspace') {
          event.preventDefault();
          handleKeypadBackspace();
        } else if (event.key === 'Enter') {
          event.preventDefault();
          if (currentInput.length > 0) {
            checkAnswer(currentInput);
          }
        }
      });
    }

    choiceModeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        choiceModeButtons.forEach((btn) => {
          btn.classList.toggle('selected', btn === button);
          btn.setAttribute('aria-pressed', btn === button ? 'true' : 'false');
        });
        selectedChoiceMode = button.dataset.choiceMode;
      });
    });

    modeButtons.forEach((button) => {
      button.addEventListener('click', () => openLevelSelection(button.dataset.mode));
    });

    backToModesButton.addEventListener('click', () => {
      tableSelection.hidden = true;
      modeSelection.hidden = false;
    });

    restartButton.addEventListener('click', () => {
      startGame(selectedLevel);
    });

    chooseTableButton.addEventListener('click', () => {
      clearTimeout(roundTimeoutId);
      isTransitioning = false;
      gameSession.hidden = true;
      tableSelection.hidden = true;
      modeSelection.hidden = false;
    });
  </script>
</body>
</html>
